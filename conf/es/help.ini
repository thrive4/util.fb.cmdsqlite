[switches]
/?, -h, -help, --help, -man muestra ayuda
-v, -ver                    muestra la versión de la utilidad

[verbose]
consulta:   cmdsqlite.exe <dbname> <query>
            cmdsqlite.exe <dbname> <filename>.query
importar:   cmdsqlite.exe <dbname> <filename>.sql
exportar:   cmdsqlite.exe <dbname> <query> <exporttype>
            cmdsqlite.exe <path> <filespec csv, json, xml file>
            cmdsqlite.exe <path> <filespec> <exporttype>
            cmdsqlite.exe <path> <filespec> <exporttype> portada
            cmdsqlite.exe <path> <filespec> <exporttype> exif
            cmdsqlite.exe <path> <filespec> <exporttype> web
            cmdsqlite.exe <path> <filespec> <exporttype> fts
            cmdsqlite.exe <path> <db> exportar <exporttype>
util:       cmdsqlite.exe <dbname> showtables
            cmdsqlite.exe <dbname> showfields <nombre de tabla>
            cmdsqlite.exe <dbname> <query> checkfile <nombre de campo>
            cmdsqlite.exe <path>   folderinfo
catálogo:   cmdsqlite.exe <drive> catalogar <exporttype = sql>
convertir:  cmdsqlite.exe <path\file>.mht

[básico]
cmdsqlite.exe <dbname> <query>
ejemplo:      cmdsqlite.exe game.db "select name from game where name like 'a%'"

cmdsqlite.exe <dbname> <filename>.query
ejemplo:      cmdsqlite.exe game.db test.query
ejecuta la consulta contenida en el archivo test.query

[exportar]
tipos de exportación: csv, html, json, sql, xml
cmdsqlite.exe <dbname> <query> <exporttype>

a sql genérico:
cmdsqlite.exe <filename>.csv
cmdsqlite.exe <filename>.json
nombre de tabla = nombre de archivo
cmdsqlite.exe <filename>.xml
nombre de tabla = nodo registro (actualmente solo un nodo profundo)

cmdsqlite.exe <base de datos> exportar <exporttype>
ejemplo: cmdsqlite.exe test.db exportar sql
nota: soporta sql, csv y xml
exporta todas las tablas en la base de datos

parámetro opcional: fts
crea una definición de tabla habilitada para búsqueda de texto virtual o completo
ejemplo: cmdsqlite.exe <filename>.json fts
nota: la tokenización no es compatible... aún

ejemplo: cmdsqlite.exe <filename>.json > <filename>.sql
crea un <filename>.sql
que contiene la estructura de la tabla sql más inserciones
se puede verificar y luego importar a la base de datos

cmdsqlite.exe <path> <filespec> <exporttype>
ejemplo: cmdsqlite.exe g:\data\mp3\70s *.mp3 html
exporta la lista de archivos que incluye ruta, nombre, extensión, tamaño, fecha y atributos

tipo de exportación especial: portada
ejemplo: cmdsqlite.exe g:\data\mp3\70s *.mp3 portada
exporta la carátula del álbum en mp3 si está presente en la carpeta 'portada'
también genera un informe mp3cover.csv

tipo de exportación suplementario: 'exif' como cuarto parámetro opcional
ejemplo: cmdsqlite.exe g:\data\images\paris *.jpg csv exif
genera un informe con:
orientación, ancho, altura, tamaño de archivo y miniatura presente
de .jpg o .png si está presente

ejemplo: cmdsqlite.exe g:\data\images\paris *.jpg html exif
filespec *.jpg crea un visualizador de imágenes

ejemplo: cmdsqlite.exe g:\data\mp3\classic *.mp3 html exif
filespec *.mp3 obtiene información de etiquetas y crea un enlace de audio
nota: la última parte de la ruta se agrega como tema

ejemplo: cmdsqlite.exe g:\data\mp3\classic *.mp3 json web
filespec *.mp3 obtiene información de etiquetas y crea un enlace de audio
similar a html exif pero agrega una columna de archivo y
trunca la ruta del archivo suponiendo wwwroot/audio en el servidor web

exporta la lista de archivos y carpetas
ejemplo cmdsqlite.exe f:\dev *.txt sql
exporta la lista de archivos que incluye ruta, nombre, extensión, tamaño, fecha y atributos

nota: sin cuarto parámetro vuelve a la configuración predeterminada
      datos de métrica de archivos (archivo, tamaño de archivo, etc.)

[importar]
a la base de datos sqlite:
cmdsqlite.exe <dbname> <filename>.sql

! crea una base de datos usando <dbname>.db o importa la
  tabla si la base de datos ya existe

[util]
cmdsqlite.exe <dbname> showtables
              <dbname> showfields <nombre de tabla>
              <dbname> <query> checkfile <nombre de campo>
              <path>   folderinfo
              ' muestra información métrica sobre el disco y carpetas en la ruta

[convertir]
los archivos .mht se convierten a .txt y .html
uso:         <filename>.mht
ejemplo:     cmdsqlite.exe g:\data\text\demo.mht
crea una carpeta <filename> y extrae todos los archivos en el .mht
además convierte el archivo .html principal a un archivo de texto separado con salto de línea.

[catalogar]
catalogar datos métricos de la carpeta en el disco
tabla archivo:  etiqueta, capacidad, espacio, tamaño de carpeta
tabla datos:    etiqueta, carpeta, datos, tamaño
ejemplo:        cmdsqlite.exe e:\ catalogar sql
                cmdsqlite.exe <drive> catalogar <exporttype = sql>

el sql resultante puede ser importado a una base de datos
nota: por razones prácticas, la etiqueta del disco debe ser única
      ambas definiciones de tabla para archivo y datos se crean
      dos veces, para inicializar la base de datos y una vez para eliminar
      datos antiguos, si el disco fue catalogado anteriormente.

> conf/conf.ini <

[aplicación]
' opciones verbose, full
tipo de registro     = completo
' usado para la construcción de depuración
usar consola         = falso
' actualmente en, de, fr y nl
localización        = en

! establece usar consola en verdadero para obtener retroalimentación en la consola
  nota usa falso al utilizar la redirección '>' de resultados
  a un archivo

> ejemplos e info <

verifica si el archivo existe de acuerdo a la ruta y el archivo en el campo especificado
<dbname> <query> checkfile <nombre de campo>
checkfile devuelve -1 si el archivo existe, de lo contrario cero 0

cmdsqlite.exe game.db "select name, developer from game" html
exporta el resultado de la consulta a una tabla html ordenable (usando plantillas)

cmdsqlite.exe game.db "select name, developer from game" json
equivalente de:
select json_object('name', name, 'developer', developer) from game" json

cmdsqlite.exe game.db "select name, developer from game" csv
exporta el resultado de la consulta a un archivo csv

consultando tablas con un guion / menos ej. table-name usa 'table-name'
"select name, developer from 'game-with-hyphen'"

ver: tutoriales en la carpeta de datos para más información detallada
